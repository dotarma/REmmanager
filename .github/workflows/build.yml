name: Build and publish
run-name: ${{ inputs.configuration }} build (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        required: true
        default: Release
        options:
          - Release
          - Debug

permissions:
  contents: read

# Serialize publication across branches/configurations to reserve unique tags.
concurrency:
  group: remmanager-build-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out selected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Check version metadata
        run: python tools/publish_release.py --check-version

      - name: Build standalone Windows x64 EXE
        run: ./tools/build_winui.ps1 -Configuration $env:BUILD_CONFIGURATION

      - name: Run backend and publishing tests
        run: |
          & ./.build-tools/python/python.exe -c "import sys,unittest; sys.path.insert(0,'.'); r=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests')); sys.exit(not r.wasSuccessful())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish EXE and SHA-256 to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py --configuration $env:BUILD_CONFIGURATION
