[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remmanager"
version = "0.5.2"
description = "REmmanager Python engine with a native WinUI 3 desktop shell"
requires-python = ">=3.11"
dependencies = ["psutil>=7"]

[project.optional-dependencies]
archives = ["py7zr>=0.22", "rarfile>=4.2"]
sso = ["websocket-client>=1.8"]

[project.scripts]
remmanager = "re_manager.app:main"

[tool.setuptools.packages.find]
include = ["re_manager*"]

[tool.setuptools.package-data]
re_manager = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/banners/*.jpg", "assets/icons/*.svg", "assets/icons/*.txt", "assets/sources.json"]
